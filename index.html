<style>
:root{--black:#0A0A0A;--white:#FAFAFA;--gray-100:#F5F5F5;--gray-200:#E5E5E5;--gray-300:#D4D4D4;--gray-400:#A3A3A3;--gray-500:#737373;--gray-600:#525252;--gray-700:#404040;--gray-800:#262626;--gradient:linear-gradient(135deg,#1a1a1a,#5a5a5a);--font-display:'Urbanist',sans-serif;--font-body:'DM Sans',sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--radius:14px;--radius-sm:10px;--radius-lg:20px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--white);color:var(--black);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a,button,input,select,textarea{-webkit-tap-highlight-color:transparent;color:inherit;}
a{text-decoration:none;}
::selection{background:rgba(90,90,90,0.2);}
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 clamp(16px,4vw,48px);height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(250,250,250,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.04);transition:all 0.4s var(--ease);}
.nav.scrolled{height:56px;background:rgba(250,250,250,0.95);}
.nav-links{display:flex;align-items:center;gap:32px;flex:1;}
.nav-link{font-size:11px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;position:relative;padding:4px 0;color:var(--gray-600);transition:color 0.3s;}
.nav-link:hover,.nav-link.active{color:var(--black);}
.nav-link::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:var(--black);transition:width 0.3s var(--ease);}
.nav-link:hover::after,.nav-link.active::after{width:100%;}
.nav-logo{position:absolute;left:50%;transform:translateX(-50%);cursor:pointer;display:flex;align-items:center;}
.nav-icons{display:flex;align-items:center;gap:20px;flex:1;justify-content:flex-end;}
.nav-icon{cursor:pointer;color:var(--gray-600);transition:color 0.2s;display:flex;align-items:center;position:relative;background:none;border:none;padding:0;}
.nav-icon:hover{color:var(--black);}
.cart-badge{position:absolute;top:-6px;right:-8px;background:var(--gradient);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.menu-btn{display:flex;cursor:pointer;background:none;border:none;color:var(--black);}
/* MOBILE MENU */
.mobile-nav{position:fixed;inset:0;background:var(--white);z-index:150;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;transform:translateY(-100%);transition:transform 0.6s var(--ease);}
.mobile-nav.open{transform:translateY(0);}
.mobile-nav-close{position:absolute;top:24px;right:24px;background:none;border:none;cursor:pointer;}
.mobile-nav-link{font-family:var(--font-display);font-size:32px;font-weight:700;cursor:pointer;letter-spacing:-0.5px;color:rgba(10,10,10,0.45);transition:color 0.2s,transform 0.3s var(--ease);opacity:0;}
.mobile-nav.open .mobile-nav-link{animation:mobileNavIn 0.5s var(--ease) forwards;}
.mobile-nav.open .mobile-nav-link:nth-child(2){animation-delay:0.1s;}
.mobile-nav.open .mobile-nav-link:nth-child(3){animation-delay:0.15s;}
.mobile-nav.open .mobile-nav-link:nth-child(4){animation-delay:0.2s;}
.mobile-nav.open .mobile-nav-link:nth-child(5){animation-delay:0.25s;}
.mobile-nav.open .mobile-nav-link:nth-child(6){animation-delay:0.3s;}
.mobile-nav.open .mobile-nav-link:nth-child(7){animation-delay:0.35s;}
.mobile-nav-link:hover{color:var(--black);transform:translateX(8px);}
@keyframes mobileNavIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
/* SIDE PANELS */
.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:199;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.panel-backdrop.open{opacity:1;pointer-events:all;}
.side-panel{position:fixed;top:0;right:0;width:min(440px,100vw);height:100vh;background:var(--white);z-index:200;transform:translateX(100%);transition:transform 0.4s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--gray-200);border-radius:var(--radius-lg) 0 0 var(--radius-lg);}
.side-panel.open{transform:translateX(0);}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:24px;border-bottom:1px solid var(--gray-200);}
.panel-title{font-family:var(--font-display);font-size:18px;font-weight:700;}
.panel-close{cursor:pointer;color:var(--gray-400);background:none;border:none;display:flex;transition:color 0.2s;}
.panel-close:hover{color:var(--black);}
.panel-body{flex:1;overflow-y:auto;padding:24px;}
.panel-footer{padding:24px;border-top:1px solid var(--gray-200);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 0;text-align:center;}
.empty-state-text{font-size:14px;color:var(--gray-400);line-height:1.6;font-weight:300;}
.cart-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--gray-100);}
.cart-item-img{width:80px;height:100px;overflow:hidden;flex-shrink:0;background:var(--gray-100);border-radius:12px;}
.cart-item-img img{width:100%;height:100%;object-fit:cover;}
.cart-item-info{flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.cart-item-brand{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:2px;}
.cart-item-name{font-family:var(--font-display);font-size:14px;font-weight:600;}
.cart-item-meta{font-size:11px;color:var(--gray-400);margin-top:2px;}
.cart-item-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.cart-item-price{font-size:14px;font-weight:500;}
.cart-item-remove{background:none;border:none;color:var(--gray-400);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:var(--font-body);transition:color 0.2s;}
.cart-item-remove:hover{color:var(--black);}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cart-total-label{font-size:14px;color:var(--gray-500);}
.cart-total-amount{font-family:var(--font-display);font-size:24px;font-weight:700;}
/* BUTTONS */
.btn{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:16px 36px;border:none;cursor:pointer;transition:all 0.3s var(--ease);display:inline-flex;align-items:center;gap:10px;border-radius:var(--radius);}
.btn-primary{background:var(--white);color:var(--black);}
.btn-primary:hover{background:var(--gray-200);transform:translateY(-2px);}
.btn-dark{background:var(--black);color:var(--white);}
.btn-dark:hover{background:var(--gray-800);transform:translateY(-2px);}
.btn-outline{background:transparent;color:var(--black);border:1px solid var(--gray-300);}
.btn-sm{padding:10px 20px;font-size:11px;}
/* HERO */
.hero{height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,5vw,64px);padding-bottom:clamp(48px,8vh,96px);position:relative;overflow:hidden;background:var(--black);color:var(--white);}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,0.95) 0%,rgba(10,10,10,0.3) 50%,rgba(10,10,10,0.6) 100%);}
.hero-content{position:relative;z-index:2;max-width:800px;}
.hero-tag{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:24px;animation:fadeUp 0.8s var(--ease) 0.2s both;}
.hero-title{font-family:var(--font-display);font-size:clamp(42px,7vw,88px);font-weight:800;line-height:1;letter-spacing:-2px;margin-bottom:24px;animation:fadeUp 0.8s var(--ease) 0.4s both;}
.hero-subtitle{font-size:clamp(15px,2vw,18px);font-weight:300;color:rgba(255,255,255,0.6);max-width:500px;line-height:1.6;margin-bottom:40px;animation:fadeUp 0.8s var(--ease) 0.6s both;}
.hero-cta{display:flex;gap:16px;animation:fadeUp 0.8s var(--ease) 0.8s both;flex-wrap:wrap;}
.gradient-text{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
/* SECTIONS */
.section{padding:clamp(48px,8vw,96px) clamp(16px,4vw,48px);}
.section-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:48px;flex-wrap:wrap;gap:16px;}
.section-title{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-1px;line-height:1.1;}
.section-subtitle{font-size:14px;color:var(--gray-500);margin-top:8px;font-weight:300;}
.section-link{font-size:13px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--gray-500);transition:color 0.3s;background:none;border:none;}
.section-link:hover{color:var(--black);}
/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;}
.product-card{cursor:pointer;position:relative;}
.product-card-image{aspect-ratio:3/4;overflow:hidden;background:var(--gray-100);position:relative;border-radius:var(--radius-lg);margin-bottom:16px;}
.product-card-image img{width:100%;height:100%;object-fit:contain;transition:transform 0.3s ease-out;will-change:transform;}
.product-card:hover .product-card-image img{transform:scale(1.04);}
.product-card-fav{position:absolute;top:12px;right:12px;width:42px;height:42px;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.3s;z-index:2;border:none;}
.product-card:hover .product-card-fav{opacity:1;}
.product-card-fav.is-fav{opacity:1;}
.product-card-brand{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:4px;}
.product-card-name{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:4px;}
.product-card-price{font-size:14px;color:var(--gray-500);font-weight:400;}
/* BRAND STRIP */
.brand-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none;}
.brand-strip::-webkit-scrollbar{display:none;}
.brand-chip{flex-shrink:0;padding:20px 32px;background:var(--gray-100);cursor:pointer;transition:all 0.3s var(--ease);display:flex;flex-direction:column;gap:4px;min-width:200px;border-radius:var(--radius);}
.brand-chip:hover{background:var(--black);color:var(--white);}
.brand-chip-name{font-family:var(--font-display);font-size:18px;font-weight:700;}
.brand-chip-city{font-size:12px;opacity:0.5;font-weight:300;}
/* MANIFESTO */
.manifesto-section{background:var(--black);color:var(--white);padding:clamp(64px,10vw,128px) clamp(16px,4vw,48px);text-align:center;}
.manifesto-quote{font-family:var(--font-display);font-size:clamp(32px,5vw,64px);font-weight:700;letter-spacing:-1px;line-height:1.15;max-width:800px;margin:0 auto 40px;}
.manifesto-text{font-size:clamp(15px,1.8vw,18px);line-height:1.8;max-width:600px;margin:0 auto 48px;opacity:0.5;font-weight:300;}
/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--black);color:var(--white);padding:14px 28px;font-size:13px;font-weight:500;z-index:300;transition:transform 0.4s var(--ease);white-space:nowrap;display:flex;align-items:center;gap:8px;border-radius:var(--radius);}
.toast.show{transform:translateX(-50%) translateY(0);}
/* FOOTER */
.footer{background:var(--black);color:var(--white);padding:clamp(48px,6vw,80px) clamp(16px,4vw,48px) 32px;}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px;}
.footer-brand{font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;line-height:1;}
.footer-tagline{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.6;font-weight:300;max-width:320px;}
.footer-col-title{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;color:rgba(255,255,255,0.5);}
.footer-link{display:block;font-size:14px;color:rgba(255,255,255,0.35);margin-bottom:10px;cursor:pointer;transition:color 0.2s;font-weight:300;}
.footer-link:hover{color:var(--white);}
.footer-bottom{display:flex;justify-content:space-between;padding-top:24px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.25);font-weight:300;}
/* SHOP FILTERS */
.filter-chip{padding:8px 20px;font-size:12px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;border:1px solid var(--gray-200);background:transparent;cursor:pointer;transition:all 0.3s;font-family:var(--font-body);color:var(--gray-500);border-radius:50px;}
.filter-chip:hover{border-color:var(--black);color:var(--black);}
.filter-chip.active{background:var(--black);color:var(--white);border-color:var(--black);}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--gray-200);transition:border-color 0.3s;border-radius:50px;}
.search-bar:focus-within{border-color:var(--black);}
.search-bar input{border:none;outline:none;font-size:13px;font-family:var(--font-body);background:transparent;width:100%;}
/* PD SIZE BTNS */
.pd-size{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-200);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:var(--font-body);background:transparent;color:var(--black);border-radius:var(--radius-sm);}
.pd-size:hover{border-color:var(--black);}
.pd-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.9);color:var(--black);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 2px 12px rgba(0,0,0,0.15);opacity:0;transition:opacity .2s,background .15s;}
.pd-imgwrap:hover .pd-arrow{opacity:1;}
.pd-arrow:hover{background:#fff;}
.pd-arrow.prev{left:12px;}
.pd-arrow.next{right:12px;}
.pd-counter{position:absolute;bottom:12px;right:12px;z-index:2;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;}
@media(hover:none){.pd-arrow{opacity:1;}}
.pd-size.selected{background:var(--black);color:var(--white);border-color:var(--black);}
/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes doubleTapHeart{0%{transform:translate(-50%,-50%) scale(0) rotate(-15deg);opacity:0;}10%{transform:translate(-50%,-50%) scale(1.4);opacity:1;}35%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}75%{transform:translate(-50%,-50%) scale(1.05);opacity:0.8;}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0;}}
.double-tap-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:10;pointer-events:none;animation:doubleTapHeart 1.1s ease forwards;filter:drop-shadow(0 4px 20px rgba(123,97,255,0.5));}
/* MOBILE */
@media(max-width:768px){
  .footer-top{grid-template-columns:1fr 1fr;gap:24px;}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .product-card-name{font-size:13px;}
  .product-card-price{font-size:12px;}
  /* Product page */
  .pd-grid{grid-template-columns:1fr!important;gap:24px!important;}
  .pd-sticky{position:static!important;}
  /* Checkout */
  .co-grid{grid-template-columns:1fr!important;gap:32px!important;}
  .co-summary{position:static!important;}
  .co-form-grid-2{grid-template-columns:1fr!important;}
  .co-form-grid-3{grid-template-columns:1fr 1fr!important;}
  /* Brand cards */
  .brands-grid{grid-template-columns:1fr!important;}
}
@media(max-width:600px){
  .nav-links{display:none;}
  .footer-top{grid-template-columns:1fr;gap:24px;}
  .hero-cta{flex-direction:column;}
  .hero-cta .btn{width:100%;justify-content:center;}
  .section{padding:40px 16px;}
  .section-header{margin-bottom:28px;}
  .brand-chip{min-width:160px;padding:16px 20px;}
  .hero-title{letter-spacing:-1px;}
  /* Checkout mobile */
  .co-form-grid-2{grid-template-columns:1fr!important;}
  .co-form-grid-3{grid-template-columns:1fr!important;}
  /* Manifesto */
  .manifesto-section{padding:48px 16px;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-links">
    <span class="nav-link active" onclick="navigate('home')">Home</span>

    <span class="nav-link" onclick="navigate('brands')">Marques</span>
    <span class="nav-link" onclick="navigate('manifesto')">Manifesto</span>
  </div>
  <div class="nav-logo" onclick="navigate('home')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="163 276 484 460" width="36" height="36">

    <button class="menu-btn" onclick="openMobileMenu()" aria-label="Menu">

    </button>
  </div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-nav" id="mobile-nav">
  <button class="mobile-nav-close" onclick="closeMobileMenu()">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <span class="mobile-nav-link" onclick="navigate('shop')">Shop</span>
  <span class="mobile-nav-link" onclick="navigate('brands')">Marques</span>
  <span class="mobile-nav-link" onclick="openFav();closeMobileMenu()">Favoris</span>
  <span class="mobile-nav-link" onclick="openCart();closeMobileMenu()">Panier</span>
  <span class="mobile-nav-link" onclick="navigate('profile')">Mon Profil</span>
  <span class="mobile-nav-link" onclick="navigate('partner')">Devenir Partenaire</span>
</div>

<!-- CART PANEL -->
<div class="panel-backdrop" id="cart-backdrop" onclick="closeCart()"></div>
<div class="side-panel" id="cart-panel">
  <div class="panel-header">
    <span class="panel-title" id="cart-title">Panier (0)</span>

  try {
    const [brandsRes, productsRes] = await Promise.all([
      fetch(API + '/api/brands').then(r => r.json()),

// TILT
function tilt(e, el) {
  const img = el.querySelector('img');
  const r = el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  img.style.transform = `perspective(800px) rotateX(${(0.5 - y) * 20}deg) rotateY(${(x - 0.5) * 20}deg) scale(1.04)`;
}
function tiltReset(el) { el.querySelector('img').style.transform = ''; }

// ---------------------------------------------------------------------
// STOCK : deux formes possibles dans la meme colonne sizes_stock
//   plate        { "S": 3, "M": 5 }                    produit sans couleur
//   par couleur  { "Rouge": { "S": 1 }, "Blanc": {} }  produit a variantes
// Detectee a la lecture : aucun ancien produit n'est touche.
// ---------------------------------------------------------------------
function stockParCouleur(ss) {
  if (!ss || typeof ss !== 'object') return false;
  const vals = Object.keys(ss).map(k => ss[k]);
  if (!vals.length) return false;
  return vals[0] !== null && typeof vals[0] === 'object' && !Array.isArray(vals[0]);
}

// Liste a plat : [{ couleur|null, taille, qte }]
// Ordre d'affichage des tailles.
// Les tailles etaient rendues dans l'ordre ou le createur les avait
// saisies : la fiche produit montrait "L, M, S, XL". On les range.
// Les tailles chiffrees (34, 36, 38) sont triees comme des nombres, et
// tout ce qui n'est ni une lettre connue ni un nombre passe a la fin.
const ORDRE_TAILLES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', '4XL'];

function rangTaille(t) {
  var v = String(t == null ? '' : t).trim().toUpperCase();
  var i = ORDRE_TAILLES.indexOf(v);
  if (i !== -1) return [0, i, ''];
  if (/^[0-9]+([.,][0-9]+)?$/.test(v)) return [1, parseFloat(v.replace(',', '.')), ''];
  if (v === 'UNIQUE' || v === 'TAILLE UNIQUE') return [3, 0, ''];
  return [2, 0, v];
}

function comparerTailles(a, b) {
  var ra = rangTaille(a), rb = rangTaille(b);
  if (ra[0] !== rb[0]) return ra[0] - rb[0];
  if (ra[1] !== rb[1]) return ra[1] - rb[1];
  return ra[2] < rb[2] ? -1 : (ra[2] > rb[2] ? 1 : 0);
}
function stockLignes(ss) {
  if (!ss || typeof ss !== 'object') return [];
  const out = [];
  if (stockParCouleur(ss)) {
    Object.keys(ss).forEach(c => {
      const tailles = ss[c] || {};
      Object.keys(tailles).forEach(t => {
        out.push({ couleur: c, taille: t, qte: parseInt(tailles[t]) || 0 });
      });
    });
  } else {
    Object.keys(ss).forEach(t => {
      out.push({ couleur: null, taille: t, qte: parseInt(ss[t]) || 0 });
    });
  }
  // On range les tailles sans toucher a l'ordre des couleurs : le createur
  // choisit l'ordre de ses couleurs, pas celui des tailles.
  var ordreCouleur = [];
  out.forEach(function (l) {
    if (ordreCouleur.indexOf(l.couleur) === -1) ordreCouleur.push(l.couleur);
  });
  out.sort(function (a, b) {
    var ca = ordreCouleur.indexOf(a.couleur), cb = ordreCouleur.indexOf(b.couleur);
    if (ca !== cb) return ca - cb;
    return comparerTailles(a.taille, b.taille);
  });
  return out;
}

function stockTotal(ss) {
  return stockLignes(ss).reduce((n, l) => n + l.qte, 0);
}

// Toutes les tailles citees, sans doublon (pour la colonne "sizes")
function stockTailles(ss) {
  const vues = [];
  stockLignes(ss).forEach(l => { if (vues.indexOf(l.taille) === -1) vues.push(l.taille); });
  return vues;
}

// SIZES from sizes_stock
function getAvailableSizes(product, couleur) {
  const lignes = stockLignes(product.sizes_stock)
    .filter(l => l.qte > 0)
    .filter(l => couleur === undefined || couleur === null || l.couleur === couleur);
  const vues = {};
  const out = [];
  lignes.forEach(l => {
    if (vues[l.taille] === undefined) { vues[l.taille] = out.length; out.push({ size: l.taille, stock: l.qte }); }
    else { out[vues[l.taille]].stock += l.qte; }
  });
  out.sort(function (a, b) { return comparerTailles(a.size, b.size); });
  return out;
}

// Couleurs qui ont au moins une piece en stock.
function getAvailableColors(product) {
  if (!stockParCouleur(product.sizes_stock)) return [];
  const out = [];
  stockLignes(product.sizes_stock).forEach(l => {
    if (l.qte > 0 && out.indexOf(l.couleur) === -1) out.push(l.couleur);
  });
  return out;
}

// NAVIGATE
// ==========================================
// ROUTAGE — chaque page a son adresse
// ==========================================
// Sans cela : impossible de partager un produit, le bouton Retour du
// navigateur sort du site, un rafraichissement renvoie a l'accueil, et
// aucun moteur de recherche ne peut indexer une page.
const ROUTES = {
  home: '',
  shop: 'shop',
  brands: 'marques',
  brand: 'marque',
  product: 'produit',
  manifesto: 'manifesto',
  partner: 'devenir-partenaire',
  checkout: 'checkout',
  login: 'connexion',
  register: 'inscription',
  profile: 'profil',
  cgv: 'cgv',
  privacy: 'confidentialite',
  legal: 'mentions-legales'
};

// Reserves par vercel.json : on ne les produit jamais et on ne les interprete pas.
const CHEMINS_RESERVES = ['admin', 'creator', 'api'];

// Un produit est designe par son slug quand il en a un, sinon par son id.
// Les details sont saisis par les createurs dans un formulaire ferme, mais
// on affiche toujours le meme ordre et les memes intitules : c'est ce qui
// fait qu'une fiche remplie a 3 champs et une fiche remplie a 5 se
// ressemblent quand meme. Les champs vides ne s'affichent pas.
function detailsProduitHTML(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return '';
  const proteger = function (v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };
  const lignes = [];
  if (d.composition) lignes.push(['Composition', proteger(d.composition)]);
  if (d.coupe) lignes.push(['Coupe', proteger(d.coupe)]);
  if (Array.isArray(d.entretien) && d.entretien.length) {
    lignes.push(['Entretien', d.entretien.map(proteger).join(' · ')]);
  }
  if (d.mannequin) lignes.push(['Mannequin', proteger(d.mannequin)]);
  if (d.fabrique) lignes.push(['Fabriqué à', proteger(d.fabrique)]);
  if (!lignes.length) return '';

  return '<div style="padding:28px 0;border-top:1px solid var(--gray-200)">'
    + '<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:14px">Détails</div>'
    + lignes.map(function (l) {
        return '<div style="display:flex;gap:16px;font-size:14px;line-height:1.9;color:var(--gray-500);font-weight:300">'
          + '<span style="min-width:110px;flex-shrink:0;color:var(--gray-400)">' + l[0] + '</span>'
          + '<span>' + l[1] + '</span></div>';
      }).join('')
    + '</div>';
}

function trouverProduit(ref) {
  if (!ref) return null;
  return PRODUCTS.find(x => x.id === ref || x.slug === ref) || null;
}

function cheminDeRoute(page, data) {
  if (page === 'product') {
    const p = trouverProduit(data);
    const ref = (p && p.slug) ? p.slug : (p ? p.id : data);
    return ref ? '/produit/' + encodeURIComponent(ref) : '/shop';
  }
  if (page === 'brand') {
    return data ? '/marque/' + encodeURIComponent(data) : '/marques';
  }
  const base = ROUTES[page];
  return (base === undefined || base === '') ? '/' : '/' + base;
}

function routeDeChemin(chemin) {
  let parts;
  try {
    parts = (chemin || '/').split('/').filter(Boolean).map(decodeURIComponent);
  } catch (e) {
    return { page: 'home', data: null };
  }
  if (!parts.length) return { page: 'home', data: null };
  if (CHEMINS_RESERVES.indexOf(parts[0]) !== -1) return null;
  if (parts[0] === 'produit') return { page: 'product', data: parts[1] || null };
  if (parts[0] === 'marque') return { page: 'brand', data: parts[1] || null };
  const trouve = Object.keys(ROUTES).filter(k => ROUTES[k] === parts[0]);
  return trouve.length ? { page: trouve[0], data: null } : { page: 'home', data: null };
}

// Quelle partie de la banniere reste visible dans le bandeau.
// Une photo verticale recadree en bandeau large perd le haut et le bas :
// 0 garde le haut, 50 le centre, 100 le bas. Le createur choisit depuis son
// panneau. Une valeur absente ou farfelue retombe sur 50 : la page ne doit
// jamais dependre de la proprete de cette donnee.
function cadrageBanniere(b) {
  const v = parseInt((b && b.banner_position), 10);
  if (isNaN(v)) return 50;
  return Math.max(0, Math.min(100, v));
}

// Tout texte saisi par un createur passe par la avant d'entrer dans la page.
// Sans ca, un texte de presentation contenant <script> serait execute.
function echapper(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Titre, description et adresse officielle suivent la page affichee.
//
// Le titre servait deja a l'historique et aux favoris. On y ajoute la
// description (le texte gris sous le lien bleu dans Google) et le canonical
// (l'adresse officielle de la page, qui evite que Google compte deux fois la
// meme page vue sous deux adresses).
//
// Google execute le JavaScript : il verra donc bien ces valeurs. Les robots
// de ChatGPT et les apercus de partage, non — eux gardent les valeurs ecrites
// en dur dans l'en-tete. C'est la limite de cette etape, et elle est connue.

const SITE_PUBLIC = 'https://www.uneek.store';
const DESCRIPTION_PAR_DEFAUT = 'UNEEK réunit des marques de mode indépendantes belges. '
  + 'Des pièces en petite série, chaque commande soutient directement un créateur.';

// Google coupe la description autour de 155 caracteres.
function couper(texte, max) {
  const t = String(texte == null ? '' : texte).replace(/\s+/g, ' ').trim();
  if (t.length <= max) return t;
  const bout = t.slice(0, max - 1);
  const espace = bout.lastIndexOf(' ');
  return (espace > max * 0.6 ? bout.slice(0, espace) : bout) + '…';
}

// Ecrit une balise <meta> ou <link> de l'en-tete, en la creant si besoin.
function poserBalise(selecteur, attribut, valeur, contenu) {
  let el = document.head.querySelector(selecteur);
  if (!el) {
    el = document.createElement(selecteur.indexOf('link') === 0 ? 'link' : 'meta');
    el.setAttribute(attribut, valeur);
    document.head.appendChild(el);
  }
  el.setAttribute(selecteur.indexOf('link') === 0 ? 'href' : 'content', contenu);
}

function majTitre(page, data) {
  let t = 'UNEEK — Marques de mode indépendantes belges';
  let description = DESCRIPTION_PAR_DEFAUT;

  if (page === 'product') {
    const p = trouverProduit(data);
    if (p) {
      const marque = (BRANDS.find(b => b.id === p.brand_id) || {}).name || '';
      t = p.name + (marque ? ' — ' + marque : '') + ' | UNEEK';
      description = couper(
        p.description
          ? p.description
          : p.name + (marque ? ' par ' + marque : '') + ', marque indépendante belge. '
            + 'Pièce en petite série disponible sur UNEEK.',
        155);
    }
  } else if (page === 'brand') {
    const b = getBrandBySlug(data);
    if (b) {
      t = b.name + ' — marque indépendante' + (b.city ? ' à ' + b.city : '') + ' | UNEEK';
      description = couper(b.tagline
        || b.name + ', marque de mode indépendante' + (b.city ? ' basée à ' + b.city : '')
           + '. Découvre ses pièces sur UNEEK.', 155);
    }
  } else {
    const noms = {
      shop: 'Shop', brands: 'Les Marques', manifesto: 'Manifesto',
      partner: 'Devenir Partenaire', checkout: 'Commande', login: 'Connexion',
      register: 'Inscription', profile: 'Mon profil', cgv: 'CGV',
      privacy: 'Confidentialité', legal: 'Mentions légales'
    };
    const textes = {
      shop: 'Toutes les pièces des marques indépendantes belges réunies sur UNEEK.',
      brands: 'Les marques indépendantes belges présentes sur UNEEK : leur histoire, leurs pièces.',
      manifesto: 'Pourquoi UNEEK existe : soutenir les créateurs indépendants, pièce par pièce.',
      partner: 'Tu crées une marque indépendante ? Rejoins UNEEK et vends tes pièces.'
    };
    if (noms[page]) t = noms[page] + ' — UNEEK';
    if (textes[page]) description = textes[page];
  }

  document.title = t;

  // Enferme : une balise mal ecrite ne doit jamais empecher la page de s'afficher.
  try {
    poserBalise('meta[name="description"]', 'name', 'description', description);
    poserBalise('meta[property="og:title"]', 'property', 'og:title', t);
    poserBalise('meta[property="og:description"]', 'property', 'og:description', description);
    poserBalise('meta[name="twitter:title"]', 'name', 'twitter:title', t);
    poserBalise('meta[name="twitter:description"]', 'name', 'twitter:description', description);
    const adresse = SITE_PUBLIC + cheminDeRoute(page, data);
    poserBalise('link[rel="canonical"]', 'rel', 'canonical', adresse);
    poserBalise('meta[property="og:url"]', 'property', 'og:url', adresse);
  } catch (e) {
    console.warn('[meta] balises non mises a jour :', e && e.message);
  }
}

// sansHistorique : utilise par le bouton Retour, qui a deja change l'adresse.
function navigate(page, data = null, sansHistorique = false) {
  currentPage = page; pageData = data;
  closeMobileMenu();
  if (!sansHistorique) {
    const chemin = cheminDeRoute(page, data);
    if (chemin !== location.pathname) {
      history.pushState({ page: page, data: data }, '', chemin);
    }
  }
  majTitre(page, data);
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderPage();
  document.querySelectorAll('.nav-link').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick') === `navigate('${page}')`);
  });
}

// Bouton Retour / Suivant du navigateur.
window.addEventListener('popstate', function () {
  const r = routeDeChemin(location.pathname);
  if (r) navigate(r.page, r.data, true);
});

// Affiche la photo d'indice i et met la bande de miniatures a jour.
function applyProductImage(i) {
  const main = document.getElementById('pd-main-img');

  if (!main || !strip) return;
  const thumbs = Array.from(strip.querySelectorAll('img'));
  if (!thumbs.length) return;
  if (i < 0) i = thumbs.length - 1;
  if (i >= thumbs.length) i = 0;
  main.src = thumbs[i].src;
  main.dataset.i = i;
  thumbs.forEach(t => { t.style.border = '2px solid transparent'; t.style.opacity = '0.6'; });
  thumbs[i].style.border = '2px solid var(--black)';
  thumbs[i].style.opacity = '1';
  const c = document.getElementById('pd-counter');
  if (c) c.textContent = (i + 1) + ' / ' + thumbs.length;
}

  applyProductImage(parseInt(el.dataset.i || '0', 10));

// Fleches gauche / droite. Boucle : apres la derniere on revient a la premiere.

  const main = document.getElementById('pd-main-img');

function pdTouchEnd(e) {
  if (pdTouchX === null) return;
  const d = e.changedTouches[0].clientX - pdTouchX;
  pdTouchX = null;
  if (Math.abs(d) > 40) stepProductImage(d < 0 ? 1 : -1);
}

async function confirmOrder() {
  const p = document.getElementById('co-prenom')?.value;
  const n = document.getElementById('co-nom')?.value;
  const e = document.getElementById('co-email')?.value;
  const a = document.getElementById('co-addr')?.value;
  const v = document.getElementById('co-ville')?.value;
  const c = document.getElementById('co-code')?.value;
  const pays = document.getElementById('co-pays')?.value || 'Belgique';
  const nickname = document.getElementById('co-nickname')?.value;
  if (!p || !n || !e || !a || !v || !c) { showToast('Remplis tous les champs'); return; }
  // Le surnom est ecrit a la main sur l'emballage : sans lui, le createur ne
  // sait pas quoi inscrire.
  if (!nickname || !nickname.trim()) {
    showToast('Ajoute un surnom — il sera écrit sur ton colis');
    document.getElementById('co-nickname')?.focus();
    return;
  }

  const btn = document.getElementById('co-btn');
  btn.textContent = 'Traitement...'; btn.disabled = true; btn.style.opacity = '0.5';

  try {
    const orderData = {
      customer: {
        email: e,
        name: `${p} ${n}`,
        nickname: nickname.trim(),
        address: `${a}, ${c} ${v}, ${pays}`
      },
      items: cart.map(item => ({
        product_id: item.id,
        quantity: 1,
        size: item.selectedSize,
        color: item.selectedColor || null
      }))
    };

    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;

    const res = await fetch(API + '/api/orders', {
      method: 'POST',
      headers,
      body: JSON.stringify(orderData)
    });
    const data = await res.json();

    if (data.success) {
      cart = []; saveCart(); renderCart();
      document.getElementById('app').innerHTML = `<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;margin-bottom:32px">

async function doLogin() {
  const email = document.getElementById('login-email')?.value;
  const password = document.getElementById('login-pass')?.value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if (!email || !password) { errEl.textContent = 'Remplis tous les champs'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Connexion...'; btn.disabled = true;
  try {
    const res = await fetch(API + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'customer_login', email, password })
    });
    const data = await res.json();
    if (data.success) {
      saveAuth(data.customer, data.token);
      showToast('Connecté !');
      navigate('profile');
    } else {
      errEl.textContent = data.error; errEl.style.display = 'block';
      btn.textContent = 'Se connecter →'; btn.disabled = false;
    }
  } catch {
    errEl.textContent = 'Erreur réseau'; errEl.style.display = 'block';
    btn.textContent = 'Se connecter →'; btn.disabled = false;
  }
}

async function doRegister() {
  const first_name = document.getElementById('reg-first')?.value;
  const last_name = document.getElementById('reg-last')?.value;
  const email = document.getElementById('reg-email')?.value;
  const nickname = document.getElementById('reg-nick')?.value;
  const password = document.getElementById('reg-pass')?.value;
  const errEl = document.getElementById('reg-error');
  const btn = document.getElementById('reg-btn');
  if (!first_name || !last_name || !email || !password) { errEl.textContent = 'Remplis tous les champs obligatoires'; errEl.style.display = 'block'; return; }
  if (password.length < 6) { errEl.textContent = 'Mot de passe trop court (min. 6)'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Création...'; btn.disabled = true;
  try {
    const res = await fetch(API + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'customer_register', email, password, first_name, last_name, nickname })
    });
    const data = await res.json();
    if (data.success) {
      saveAuth(data.customer, data.token);
      showToast('Compte créé !');
      navigate('profile');
    } else {
      errEl.textContent = data.error; errEl.style.display = 'block';
      btn.textContent = 'Créer mon compte →'; btn.disabled = false;
    }
  } catch {
    errEl.textContent = 'Erreur réseau'; errEl.style.display = 'block';
    btn.textContent = 'Créer mon compte →'; btn.disabled = false;
  }
}

// Load profile orders after render
async function loadProfileOrders() {
  if (!authToken) return;
  try {
    const res = await fetch(API + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ action: 'customer_profile' })
    });
    const data = await res.json();
    if (data.success && data.orders) {
      const countEl = document.getElementById('prof-orders-count');
      const ordersEl = document.getElementById('prof-orders');
      if (countEl) countEl.textContent = data.orders.length;
      if (ordersEl && data.orders.length > 0) {
        ordersEl.innerHTML = `<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:16px">Mes commandes</div>` +
          data.orders.map(o => `<div style="padding:16px;background:var(--gray-100);border-radius:var(--radius-sm);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-family:var(--font-display);font-size:14px;font-weight:600">${o.order_number}</div>
              <div style="font-size:12px;color:var(--gray-400)">${new Date(o.created_at).toLocaleDateString('fr-FR')}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:500">${o.total_amount} &euro;</div>
              <div style="font-size:11px;color:var(--gray-400);text-transform:uppercase">${o.status}</div>
            </div>
          </div>`).join('');
      } else if (ordersEl) {
        ordersEl.innerHTML = '';
        if (countEl) countEl.textContent = '0';
      }
    }
  } catch { /* silent */ }
}

async function updateProfile() {
  const btn = document.getElementById('prof-btn');
  const first_name = document.getElementById('prof-first')?.value;
  const last_name = document.getElementById('prof-last')?.value;
  const nickname = document.getElementById('prof-nick')?.value;
  btn.textContent = 'Sauvegarde...'; btn.disabled = true;
  try {
    const res = await fetch(API + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ action: 'customer_update_profile', first_name, last_name, nickname })
    });

    if (data.success) {

    } else { showToast(data.error || 'Erreur'); }
  } catch { showToast('Erreur réseau'); }
  btn.textContent = 'Sauvegarder'; btn.disabled = false;
}

function doLogout() {

function renderPage() {
  const app = document.getElementById('app');
  selectedSize = null;
  selectedColor = null;
  if (!dataLoaded) {
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div style="font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:8px">UNEEK</div><div style="color:var(--gray-400);font-size:14px">Chargement...</div></div></div>';
    return;
  }
  switch (currentPage) {
    case 'home': app.innerHTML = homePage(); break;
    case 'shop': app.innerHTML = shopPage(); break;
    case 'product': app.innerHTML = productPage(); break;
    case 'brands': app.innerHTML = brandsPage(); break;
    case 'brand': app.innerHTML = brandPage(); break;
    case 'manifesto': app.innerHTML = manifestoPage(); break;
    case 'partner': app.innerHTML = partnerPage(); break;
    case 'checkout': app.innerHTML = checkoutPage(); break;
    case 'login': app.innerHTML = loginPage(); break;
    case 'register': app.innerHTML = registerPage(); break;
    case 'profile': app.innerHTML = profilePage(); if (currentUser) loadProfileOrders(); break;
    case 'cgv': app.innerHTML = legalPage('cgv'); break;
    case 'privacy': app.innerHTML = legalPage('privacy'); break;
    case 'legal': app.innerHTML = legalPage('legal'); break;
    default: app.innerHTML = homePage();
  }
}

// INIT
async function init() {
  // L'adresse fait foi des le depart : /produit/xxx ouvre la fiche produit,
  // pas l'accueil. Les donnees ne sont pas encore la, on affiche le
  // chargement puis on redessine.
  const r = routeDeChemin(location.pathname);
  if (r) { currentPage = r.page; pageData = r.data; }
  history.replaceState({ page: currentPage, data: pageData }, '', location.pathname + location.search);
  renderPage(); // show loading
  await loadData();
  renderPage(); // show real content
  majTitre(currentPage, pageData);
  renderCart();
}

init();
